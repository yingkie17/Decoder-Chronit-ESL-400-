# =============================================================================
# CHRONIT ECOSYSTEM — Nginx (proxy para los servicios web)
# -----------------------------------------------------------------------------
# Sirve la pantalla pública y el frontend Next.js. Se completa cuando se decida
# el despliegue (dominio, SSL, rutas /admin, /display, /kiosco).
# =============================================================================
events {}

http {
    upstream chronit_frontend {
        server tickets-frontend:3000;
    }

    upstream chronit_api {
        server tickets-backend:4000;
    }

    server {
        listen 80;

        # Pantalla pública (sin login)
        location /display {
            proxy_pass http://chronit_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API de tickets
        location /api/ {
            proxy_pass http://chronit_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Resto del frontend
        location / {
            proxy_pass http://chronit_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
