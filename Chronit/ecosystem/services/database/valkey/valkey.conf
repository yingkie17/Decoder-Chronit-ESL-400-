# =============================================================================
# CHRONIT ECOSYSTEM — Valkey (sesiones de usuario + caché de pantalla pública)
# -----------------------------------------------------------------------------
# Configuración mínima de producción para el contenedor valkey/valkey.
# =============================================================================

# Escuchar en todas las interfaces (necesario dentro del contenedor)
bind 0.0.0.0

# Protección de modo protegido deshabilitada dentro de la red del contenedor
protected-mode no

# Puerto por defecto de Valkey/Redis
port 6379

# Persistencia de sesiones
appendonly yes
appendfsync everysec
dir /data

# Límites de memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""
