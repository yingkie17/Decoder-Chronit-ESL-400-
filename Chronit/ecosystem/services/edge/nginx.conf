# =============================================================================
# CHRONIT ECOSYSTEM — Borde TLS: enrutado
# -----------------------------------------------------------------------------
# Un `server` por servicio, escuchando TLS en el MISMO puerto que el servicio
# interno. Así el navegador carga https://<host>:3000 y el frontend resuelve
# sus APIs como https://<host>:4000 / :4100 / :4200 sin cambios de código.
#
# Los parámetros TLS/HSTS comunes viven en /etc/nginx/snippets/tls.conf.
# Se reenvían X-Forwarded-Proto/For/Host para que los backends resuelvan el
# esquema original y la IP real del cliente (auditoría).
# Soporte de WebSocket (Socket.io del sistema de tickets).
# =============================================================================

server {
  listen 3000 ssl;
  http2 on;
  server_name _;
  include /etc/nginx/snippets/tls.conf;

  location / {
    proxy_pass http://tickets-frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 3000;
  }
}

